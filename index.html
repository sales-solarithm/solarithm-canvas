<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solarithm Canvas</title>
    <meta name="description" content="Enterprise-grade solar engineering report and PDF submission studio with double-bordered technical drawings, shadow analysis, and structured engineering note libraries." />
    <meta property="og:title" content="Solarithm Canvas" />
    <meta property="og:description" content="Enterprise-grade solar engineering report and PDF submission studio with double-bordered technical drawings, shadow analysis, and structured engineering note libraries." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('solarithm_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F4F5] text-zinc-900 dark:bg-[#0E0E10] dark:text-zinc-100 min-h-screen antialiased selection:bg-[#D4AF37] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
